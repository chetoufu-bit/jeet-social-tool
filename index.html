<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社媒发布控制台</title>
<style>
  :root{
    --bg:#f6f5f2; --panel:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e4e2dc;
    --accent:#1f6f5c; --accent-soft:#e3f0ec; --warn:#b54708; --warn-soft:#fdf0e6;
    --err:#b42318; --err-soft:#fdecea; --ok:#1f6f5c;
    --space:#1f6f5c;
    --radius:10px; --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:6px 12px;color:var(--ink)}
  button:hover{border-color:#c9c6bd}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.08)}
  button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  button.ghost:hover{color:var(--ink);background:#efede8}
  button.small{padding:3px 9px;font-size:12px}
  button:disabled{opacity:.5;cursor:not-allowed}
  input[type=text],input[type=url],textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
  input[type=text]:focus,input[type=url]:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  textarea{resize:vertical;min-height:160px}
  label.small{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}

  header{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);border-top:4px solid var(--space);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;color:var(--muted)}
  .space{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:#fff;background:var(--space);padding:4px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .space:hover{filter:brightness(1.08)}
  .space small{font-weight:500;font-size:11px;opacity:.85}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:#efede8;color:var(--muted)}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:#aaa}
  .pill.ok{background:var(--accent-soft);color:var(--accent)} .pill.ok .dot{background:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.warn .dot{background:var(--warn)}
  .pill.err{background:var(--err-soft);color:var(--err)} .pill.err .dot{background:var(--err)}
  .accounts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}

  .layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 62px)}
  aside{border-right:1px solid var(--line);background:#fbfaf8;padding:14px;display:flex;flex-direction:column;gap:10px}
  aside .actions{display:flex;gap:6px;flex-wrap:wrap}
  .draft-list{display:flex;flex-direction:column;gap:6px;overflow:auto}
  .draft-item{padding:10px;border-radius:var(--radius);border:1px solid transparent;cursor:pointer;background:transparent}
  .draft-item:hover{background:#f0eee9}
  .draft-item.active{background:#fff;border-color:var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .draft-item .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .draft-item .m{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:4px;flex-wrap:wrap}
  .tag{font-size:11px;padding:0 6px;border-radius:4px;background:#efede8;color:var(--muted)}
  .tag.done{background:var(--accent-soft);color:var(--accent)}
  .empty{color:var(--muted);font-size:13px;padding:20px 6px;text-align:center}

  main{padding:20px 24px 120px;min-width:0}
  .topic-row{display:grid;grid-template-columns:2fr 1fr;gap:12px}
  .media-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
  @media (max-width:1100px){.media-row{grid-template-columns:1fr}}
  .images{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#eee}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb button{position:absolute;top:3px;right:3px;padding:0 6px;font-size:12px;line-height:18px;background:rgba(0,0,0,.6);color:#fff;border:none}
  .thumb .idx{position:absolute;left:4px;bottom:3px;font-size:11px;color:#fff;background:rgba(0,0,0,.5);padding:0 5px;border-radius:4px}
  .add-img{width:84px;height:84px;border:1px dashed #c9c6bd;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;font-size:12px;text-align:center}
  .add-img:hover{border-color:var(--accent);color:var(--accent)}
  .video-box{border:1px dashed #c9c6bd;border-radius:8px;padding:10px;background:#fff;margin-top:6px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg label{padding:3px 12px;cursor:pointer;font-size:12px;border-right:1px solid var(--line);user-select:none}
  .seg label:last-child{border-right:0}
  .seg input{display:none}
  .seg label.on{background:var(--accent);color:#fff}
  .video-info{font-size:12px;color:var(--muted);margin-top:6px}
  .video-info.ok{color:var(--accent)} .video-info.err{color:var(--err)}
  video.preview{max-width:100%;max-height:150px;border-radius:6px;margin-top:6px;background:#000;display:block}

  .common{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:14px;margin-top:18px}
  .common-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .common-h b{font-size:14px}
  .common-h .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
  .common-grid{display:grid;grid-template-columns:1fr;gap:0}

  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
  @media (max-width:1250px){.cards{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column}
  .card.off{opacity:.55}
  .card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card-h .name{font-weight:600}
  .card-h .badge{width:10px;height:10px;border-radius:3px}
  .card-h .acc{font-size:12px;color:var(--muted)}
  .card-h .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .switch{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .count{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
  .count.over{color:var(--err);font-weight:600}
  .card-f{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .card-f .st{font-size:12px;color:var(--muted);margin-left:auto}
  .card-f .st.done{color:var(--accent)}
  .hint{font-size:12px;color:var(--warn);margin-top:6px}
  .kind{font-size:11px;padding:0 6px;border-radius:4px;background:#efede8;color:var(--muted)}

  .bar{position:fixed;left:270px;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px 24px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(6px)}
  .bar .log{font-size:12px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .to{font-size:12px;color:var(--muted)}
  .bar .to b{color:var(--space)}

  dialog{border:none;border-radius:14px;padding:0;width:min(720px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.2)}
  dialog::backdrop{background:rgba(0,0,0,.3)}
  .dlg{padding:20px}
  .dlg h2{margin:0 0 6px;font-size:16px}
  .dlg p{margin:0 0 10px;color:var(--muted);font-size:13px}
  .dlg textarea.code{min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
  .pf-opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;user-select:none}
  .pf-opt.on{border-color:var(--accent);background:var(--accent-soft)}
  .colors{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .colors span{width:28px;height:28px;border-radius:7px;cursor:pointer;border:3px solid transparent}
  .colors span.on{border-color:#1d1d1f}
  .presets{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .hist{max-height:60vh;overflow:auto}
  .hist-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .hist-item:last-child{border-bottom:0}
  .hist-item .meta{color:var(--muted);font-size:12px}
  .hist-item .res{display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;font-size:12px}
  .hist-item .res .ok{color:var(--accent)} .hist-item .res .bad{color:var(--err)}
  .toast{position:fixed;top:74px;right:20px;background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:.92}
  .banner{margin:0 0 14px;padding:10px 14px;border-radius:var(--radius);font-size:13px}
  .banner.warn{background:var(--warn-soft);color:var(--warn)}
  .banner.err{background:var(--err-soft);color:var(--err)}
  .banner button{margin-left:8px}
</style>
</head>
<body>
<header>
  <span class="space" id="spaceBadge" title="点击修改空间名称和平台设置"><span id="spaceName">未命名空间</span><small>设置</small></span>
  <h1>社媒发布控制台</h1>
  <span id="extStatus" class="pill"><span class="dot"></span><span>检测插件中…</span></span>
  <button id="btnTrust" class="primary" style="display:none">授权此网站</button>
  <div class="accounts" id="accounts"></div>
  <button id="btnRefreshAcc" class="ghost" title="打开插件的账号刷新窗口">刷新账号</button>
  <button id="btnSettings" class="ghost">平台设置</button>
</header>

<div class="layout">
  <aside>
    <div class="actions">
      <button id="btnNew" class="primary">＋ 新建</button>
      <button id="btnImport">导入草稿</button>
      <button id="btnSync" title="读取网站目录下的 drafts.json">同步仓库</button>
    </div>
    <div class="draft-list" id="draftList"></div>
    <div style="margin-top:auto;display:flex;gap:6px;flex-wrap:wrap">
      <button class="ghost" id="btnHistory">发布记录</button>
      <button class="ghost" id="btnExport">导出备份</button>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div class="bar">
  <button id="btnPublish" class="primary">发布到选中平台</button>
  <span class="to">当前空间：<b id="barSpace"></b></span>
  <div class="log" id="log">准备就绪</div>
</div>

<dialog id="dlgImport">
  <div class="dlg">
    <h2>导入草稿</h2>
    <p>把 Claude 给你的草稿 JSON 整段粘贴进来。同一个 id 的草稿会被更新，新的会加到列表里。平台键：xhs、threads、x、tiktok、youtube；也可以给一份 common 通用文案。</p>
    <textarea id="importText" class="code" placeholder='{"drafts":[{"topic":"...","common":{"title":"...","content":"...","tags":["..."]},"x":{"content":"...","tags":[]},"youtube":{"title":"...","content":"...","tags":[]}}]}'></textarea>
    <div class="row">
      <button id="btnImportCancel">取消</button>
      <button id="btnImportOk" class="primary">导入</button>
    </div>
  </div>
</dialog>

<dialog id="dlgSettings">
  <div class="dlg">
    <h2>平台设置</h2>
    <p>选填。设置只存在当前浏览器里，默认 5 个平台全部显示。</p>
    <label class="small">空间名称（选填，显示在页面顶部，方便区分是哪个浏览器）</label>
    <input type="text" id="setSpace" placeholder="可不填，例如账号名">
    <label class="small">空间颜色</label>
    <div class="colors" id="setColors"></div>
    <label class="small">显示哪些平台（不用的可以关掉）</label>
    <div class="pf-grid" id="setPlatforms"></div>
    <div class="row">
      <button id="btnSettingsCancel">取消</button>
      <button id="btnSettingsOk" class="primary">保存</button>
    </div>
  </div>
</dialog>

<dialog id="dlgHistory">
  <div class="dlg">
    <h2>发布记录</h2>
    <p>记录每次发送给插件的结果（只存在当前浏览器，最多 300 条）。“已发送”表示插件已接收，最终是否发布成功请到平台确认。</p>
    <div class="hist" id="histList"></div>
    <div class="row">
      <button id="btnHistClear" class="ghost">清空记录</button>
      <button id="btnHistClose" class="primary">关闭</button>
    </div>
  </div>
</dialog>

<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="videoInput" accept="video/*" hidden>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  /* ---------- 平台配置 ---------- */
  // kind: dynamic = 图文平台；video = 视频平台
  const PLATFORMS = [
    { key: "xhs",     name: "小红书",  mp: "DYNAMIC_REDNOTE", account: "rednote", color: "#ff2442", kind: "dynamic",
      hasTitle: true, titleMax: 20, max: 1000, tagStyle: "xhs", needImage: true, maxImages: 18, allowVideo: false },
    { key: "threads", name: "Threads", mp: "DYNAMIC_THREADS", account: "threads", color: "#111111", kind: "dynamic",
      hasTitle: false, max: 500, tagStyle: "plain", maxImages: 10, allowVideo: true },
    { key: "x",       name: "X",       mp: "DYNAMIC_X",       account: "x",       color: "#111111", kind: "dynamic",
      hasTitle: false, max: 280, weighted: true, tagStyle: "plain", maxImages: 4, allowVideo: true },
    { key: "tiktok",  name: "TikTok",  mp: "VIDEO_TIKTOK",    account: "tiktok",  color: "#25f4ee", kind: "video",
      hasTitle: false, max: 2200, tagStyle: "plain", needVideo: true },
    { key: "youtube", name: "YouTube", mp: "VIDEO_YOUTUBE",   account: "youtube", color: "#ff0000", kind: "video",
      hasTitle: true, titleMax: 100, titleRequired: true, max: 5000, tagStyle: "plain", needVideo: true, tagsInDesc: true },
  ];
  const PMAP = Object.fromEntries(PLATFORMS.map(p => [p.key, p]));
  const COLORS = ["#5b3df5", "#1f6f5c", "#d9480f", "#c2255c", "#1971c2", "#495057"];
  const PUBLISH_GAP_MS = 6000;      // 插件一次只保存一份待发布数据，两次发布之间要留出时间
  const VIDEO_MAX_MB = 45;          // chrome 消息上限 64MB，data URL 会变大约 1/3
  const LS_DRAFTS = "pub.drafts.v1";
  const LS_PREFS = "pub.prefs.v1";
  const LS_SETTINGS = "pub.settings.v1";
  const LS_HISTORY = "pub.history.v1";

  /* ---------- 小工具 ---------- */
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const uid = () => "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const mb = (b) => (b / 1024 / 1024).toFixed(1) + "MB";
  const fmtTime = (t) => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400); }
  function log(msg) { $("#log").textContent = `${fmtTime(Date.now())}  ${msg}`; }

  function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast("本地保存失败：" + e.message); return false; } }

  function normTags(tags) {
    if (!tags) return [];
    const arr = Array.isArray(tags) ? tags : String(tags).split(/[\s,，#]+/);
    return arr.map(t => String(t).trim().replace(/^#+|#+$/g, "")).filter(Boolean);
  }
  function tagsToText(tags) { return normTags(tags).join(" "); }
  const hashTags = (tags, style) => normTags(tags).map(t => style === "xhs" ? `#${t}#` : `#${t}`).join(" ");

  // X 的计数规则：中日韩文字、emoji 等算 2，链接一律算 23
  function xWeightedLength(text) {
    let s = String(text || "");
    let n = 0;
    s = s.replace(/https?:\/\/\S+/g, () => { n += 23; return ""; });
    for (const ch of s) {
      const c = ch.codePointAt(0);
      const light = (c <= 4351) || (c >= 8192 && c <= 8205) || (c >= 8208 && c <= 8223) || (c >= 8242 && c <= 8247);
      n += light ? 1 : 2;
    }
    return n;
  }
  function fullText(p, d) {
    const part = d[p.key] || {};
    const tagStr = hashTags(part.tags, p.tagStyle);
    if (!tagStr) return part.content || "";
    return (part.content || "") + (p.tagsInDesc ? "\n\n" : " ") + tagStr;
  }
  function countFor(p, d) {
    const text = fullText(p, d);
    return p.weighted ? xWeightedLength(text) : [...text].length;
  }

  /* ---------- 设置（每个浏览器各自一份） ---------- */
  // 默认 5 个平台全开；只用其中几个的话，可以在“平台设置”里关掉不用的
  let settings = lsGet(LS_SETTINGS, null) || { space: "", color: COLORS[0], enabled: PLATFORMS.map(p => p.key) };
  const enabledPlatforms = () => PLATFORMS.filter(p => settings.enabled.includes(p.key));

  function applySpace() {
    const name = settings.space || "";
    $("#spaceBadge").style.display = name ? "" : "none";
    $("#spaceName").textContent = name;
    $("#barSpace").parentElement.style.display = name ? "" : "none";
    $("#barSpace").textContent = name;
    document.documentElement.style.setProperty("--space", name ? (settings.color || COLORS[0]) : "transparent");
    document.title = name ? `${name} · 社媒发布控制台` : "社媒发布控制台";
  }

  /* ---------- 图片存储（IndexedDB，避免 localStorage 装不下） ---------- */
  const idb = (() => {
    let dbp;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open("publisher", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("images");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const tx = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction("images", mode);
        const req = fn(t.objectStore("images"));
        t.oncomplete = () => res(req && req.result);
        t.onerror = () => rej(t.error);
      });
    };
    return {
      get: (id) => tx("readonly", s => s.get(id)).then(v => v || []),
      set: (id, v) => tx("readwrite", s => s.put(v, id)),
      del: (id) => tx("readwrite", s => s.delete(id)),
    };
  })();

  function readAsDataURL(file) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
  }

  /* ---------- 视频（只存在内存里，不进草稿） ---------- */
  // 本地视频按草稿 id 暂存在内存中，刷新页面后需要重新选择
  const localVideos = new Map();   // draftId -> {name,type,size,dataUrl,previewUrl}

  function guessVideoType(name) {
    const ext = (String(name).split(".").pop() || "").toLowerCase();
    return ({ mp4: "video/mp4", m4v: "video/mp4", mov: "video/quicktime", webm: "video/webm" })[ext] || "video/mp4";
  }
  // 返回发布时用的视频 FileData，没有则 null
  function currentVideo(d) {
    if (!d) return null;
    if ((d.videoSource || "file") === "url") {
      const u = (d.videoUrl || "").trim();
      if (!/^https:\/\//i.test(u)) return null;
      let name = "video.mp4";
      try { name = decodeURIComponent(new URL(u).pathname.split("/").filter(Boolean).pop() || name); } catch {}
      return { name, url: u, type: guessVideoType(name), size: 0 };
    }
    const v = localVideos.get(d.id);
    return v ? { name: v.name, url: v.dataUrl, type: v.type, size: v.size } : null;
  }

  /* ---------- MultiPost 插件通信 ---------- */
  const pending = new Map();
  window.addEventListener("message", (e) => {
    if (e.source !== window) return;
    const m = e.data;
    if (!m || m.type !== "response" || !pending.has(m.traceId)) return;
    const { resolve, timer } = pending.get(m.traceId);
    clearTimeout(timer); pending.delete(m.traceId);
    resolve(m);
  });
  function ext(action, data = {}, timeout = 4000) {
    return new Promise((resolve) => {
      const traceId = "t" + Math.random().toString(36).slice(2) + Date.now();
      const timer = setTimeout(() => { pending.delete(traceId); resolve({ code: -1, message: "timeout" }); }, timeout);
      pending.set(traceId, { resolve, timer });
      window.postMessage({ type: "request", traceId, action: "MULTIPOST_EXTENSION_" + action, data }, location.origin === "null" ? "*" : location.origin);
    });
  }

  let extState = "unknown";  // unknown | missing | untrusted | ready
  let accountInfo = {};

  function setStatus(state, text) {
    extState = state;
    const el = $("#extStatus");
    el.className = "pill " + ({ ready: "ok", untrusted: "warn", missing: "err" }[state] || "");
    el.lastElementChild.textContent = text;
    $("#btnTrust").style.display = state === "untrusted" ? "" : "none";
    renderBanner();
  }

  async function checkExtension() {
    if (location.protocol === "file:") {
      setStatus("missing", "请用 https 网址打开本页");
      return;
    }
    const r = await ext("CHECK_SERVICE_STATUS", {}, 2500);
    if (r.code === 0) {
      setStatus("ready", `插件已连接 v${r.data?.extensionVersion || ""}`);
      await loadAccounts();
    } else if (r.code === 403) {
      setStatus("untrusted", "插件未授权本网站");
    } else {
      setStatus("missing", "未检测到 MultiPost 插件");
    }
  }

  async function loadAccounts() {
    const r = await ext("GET_ACCOUNT_INFOS");
    accountInfo = (r.code === 0 && r.data?.accountInfo) || {};
    renderAccounts();
    renderEditor();
  }
  const accName = (p) => { const a = accountInfo[p.account]; return a ? (a.username || a.accountId) : ""; };

  function renderAccounts() {
    $("#accounts").innerHTML = enabledPlatforms().map(p => {
      const n = accName(p);
      return `<span class="pill ${n ? "ok" : ""}" title="${n ? "已登录" : "插件里还没有这个平台的账号信息，可点“刷新账号”"}"><span class="dot"></span>${esc(p.name)}：${n ? esc(n) : "未识别"}</span>`;
    }).join("");
  }

  /* ---------- 草稿数据 ---------- */
  let drafts = lsGet(LS_DRAFTS, []);
  let prefs = lsGet(LS_PREFS, {});
  prefs.selected = { xhs: true, threads: true, x: true, tiktok: true, youtube: true, ...(prefs.selected || {}) };
  prefs.auto = { xhs: false, threads: false, x: false, tiktok: false, youtube: false, ...(prefs.auto || {}) };
  prefs.withImg = prefs.withImg || {};
  prefs.withVideo = prefs.withVideo || {};
  let currentId = drafts[0]?.id || null;
  let currentImages = [];

  const emptyPart = () => ({ title: "", content: "", tags: [] });
  function blankDraft() {
    const d = { id: uid(), topic: "未命名草稿", suggestedTime: "", imageNote: "", createdAt: Date.now(), updatedAt: Date.now(),
      common: emptyPart(), videoSource: "file", videoUrl: "", published: {} };
    for (const p of PLATFORMS) d[p.key] = emptyPart();
    return d;
  }
  // 兼容旧草稿：补齐新平台和通用文案字段
  function upgradeDraft(d) {
    for (const p of PLATFORMS) if (!d[p.key]) d[p.key] = emptyPart();
    if (!d.common) d.common = emptyPart();
    if (!d.videoSource) d.videoSource = "file";
    if (d.videoUrl == null) d.videoUrl = "";
    if (!d.published) d.published = {};
    return d;
  }
  drafts = drafts.map(upgradeDraft);

  const ALIASES = { xhs: ["rednote", "xiaohongshu"], youtube: ["yt"], tiktok: ["tt"] };
  function normalizeDraft(raw) {
    const d = blankDraft();
    if (raw.id) d.id = String(raw.id);
    d.topic = raw.topic || raw.title || raw.common?.title || raw.xhs?.title || d.topic;
    d.suggestedTime = raw.suggestedTime || raw.time || "";
    d.imageNote = raw.imageNote || raw.image || "";
    const toPart = (src) => ({ title: src?.title || "", content: src?.content || src?.text || "", tags: normTags(src?.tags) });
    if (raw.common) d.common = toPart(raw.common);
    for (const p of PLATFORMS) {
      let src = raw[p.key];
      if (!src) for (const a of (ALIASES[p.key] || [])) if (raw[a]) { src = raw[a]; break; }
      if (src) d[p.key] = toPart(src);
      else if (raw.common) d[p.key] = commonFor(p, d.common);   // 只给了通用文案时，自动铺到各平台
    }
    const vurl = raw.videoUrl || raw.video_url || raw.video;
    if (typeof vurl === "string" && /^https:\/\//i.test(vurl)) { d.videoSource = "url"; d.videoUrl = vurl; }
    d.published = raw.published || {};
    return d;
  }
  const current = () => drafts.find(d => d.id === currentId);
  function saveDrafts() { lsSet(LS_DRAFTS, drafts); }
  function savePrefs() { lsSet(LS_PREFS, prefs); }

  function mergeDrafts(list) {
    let added = 0, updated = 0;
    for (const raw of list) {
      const d = normalizeDraft(raw);
      const i = drafts.findIndex(x => x.id === d.id);
      if (i >= 0) {
        d.published = drafts[i].published || {}; d.createdAt = drafts[i].createdAt;
        if (!raw.videoUrl && !raw.video_url && !raw.video) { d.videoSource = drafts[i].videoSource; d.videoUrl = drafts[i].videoUrl; }
        drafts[i] = d; updated++;
      } else { drafts.unshift(d); added++; }
    }
    saveDrafts();
    return { added, updated };
  }
  function parseImport(text) {
    let s = text.trim();
    const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (fence) s = fence[1];
    const obj = JSON.parse(s);
    if (Array.isArray(obj)) return obj;
    if (Array.isArray(obj.drafts)) return obj.drafts;
    return [obj];
  }

  /* ---------- 通用文案 → 各平台 ---------- */
  function commonFor(p, c) {
    return { title: p.hasTitle ? (c.title || "") : "", content: c.content || "", tags: normTags(c.tags) };
  }
  function syncCommonToAll(d, { silent = false } = {}) {
    for (const p of enabledPlatforms()) d[p.key] = commonFor(p, d.common);
    touch();
    if (!silent) {
      for (const p of enabledPlatforms()) {
        const card = $(`.card[data-p="${p.key}"]`); if (!card) continue;
        const part = d[p.key];
        card.querySelectorAll("[data-f]").forEach(inp => {
          const f = inp.dataset.f;
          inp.value = f === "tags" ? tagsToText(part.tags) : (part[f] || "");
        });
        updateCount(p);
      }
    }
  }

  /* ---------- 渲染 ---------- */
  function renderList() {
    const el = $("#draftList");
    if (!drafts.length) { el.innerHTML = `<div class="empty">还没有草稿<br>点“新建”或“导入草稿”</div>`; return; }
    el.innerHTML = drafts.map(d => {
      const tags = enabledPlatforms().map(p => d.published?.[p.key]
        ? `<span class="tag done">${p.name} ✓</span>` : "").join("");
      return `<div class="draft-item ${d.id === currentId ? "active" : ""}" data-id="${esc(d.id)}">
        <div class="t">${esc(d.topic)}</div>
        <div class="m">${d.suggestedTime ? `<span>${esc(d.suggestedTime)}</span>` : `<span>${fmtTime(d.updatedAt)}</span>`}${tags}</div>
      </div>`;
    }).join("");
  }

  function renderBanner() {
    const b = $("#banner");
    if (!b) return;
    if (extState === "missing") {
      b.className = "banner err";
      b.innerHTML = location.protocol === "file:"
        ? "本页是直接双击打开的，插件无法识别。请部署到 GitHub Pages 后用 https 网址打开。"
        : "没有检测到 MultiPost 插件。请确认在当前 Chrome 配置中已安装并启用插件，然后刷新本页。<button id='btnRecheck'>重新检测</button>";
    } else if (extState === "untrusted") {
      b.className = "banner warn";
      b.innerHTML = "插件已安装，但还没信任本网站。点右上角“授权此网站”，在弹窗里确认即可。";
    } else { b.className = ""; b.innerHTML = ""; }
    const rc = $("#btnRecheck"); if (rc) rc.onclick = checkExtension;
  }

  const usesImages = () => enabledPlatforms().some(p => p.kind === "dynamic");
  const usesVideo = () => enabledPlatforms().some(p => p.needVideo || p.allowVideo);

  async function renderEditor() {
    const main = $("#main");
    const d = current();
    if (!d) { main.innerHTML = `<div id="banner"></div><div class="empty" style="padding-top:80px">选择左侧草稿，或新建一条</div>`; renderBanner(); return; }
    currentImages = await idb.get(d.id);
    const plats = enabledPlatforms();
    const anyTitle = plats.some(p => p.hasTitle);
    main.innerHTML = `
      <div id="banner"></div>
      <div class="topic-row">
        <div>
          <label class="small">主题（只在本页显示）</label>
          <input type="text" id="fTopic" value="${esc(d.topic)}">
        </div>
        <div>
          <label class="small">建议发布时间</label>
          <input type="text" id="fTime" value="${esc(d.suggestedTime)}" placeholder="例如：今晚 21:00">
        </div>
      </div>
      <div class="media-row">
        ${usesImages() ? `<div>
          <label class="small">配图（图文平台共用；小红书必须有图，X 只取前 4 张）${d.imageNote ? " · 配图建议：" + esc(d.imageNote) : ""}</label>
          <div class="images" id="images"></div>
        </div>` : ""}
        ${usesVideo() ? `<div>
          <label class="small">视频（TikTok、YouTube 必须有；X、Threads 可选带）</label>
          <div class="video-box">
            <div class="seg" id="vSrc">
              <label class="${d.videoSource !== "url" ? "on" : ""}"><input type="radio" name="vsrc" value="file">本地文件（≤${VIDEO_MAX_MB}MB）</label>
              <label class="${d.videoSource === "url" ? "on" : ""}"><input type="radio" name="vsrc" value="url">https 链接</label>
            </div>
            <div id="vBody"></div>
          </div>
        </div>` : ""}
      </div>
      <div class="common">
        <div class="common-h">
          <b>通用文案</b><span class="kind">各平台发同样内容时用</span>
          <div class="right">
            <label class="switch" title="勾选后，改通用文案会实时同步到各平台的文案框"><input type="checkbox" id="fLinked" ${prefs.linked ? "checked" : ""}>边改边同步</label>
            <button class="primary small" id="btnSyncAll">同步到所有平台</button>
          </div>
        </div>
        ${anyTitle ? `<label class="small">标题（会同步给需要标题的平台：${plats.filter(p => p.hasTitle).map(p => `${p.name} ≤${p.titleMax} 字`).join("、")}）</label>
        <input type="text" id="cTitle" value="${esc(d.common.title)}">` : ""}
        <label class="small">正文</label>
        <textarea id="cContent" style="min-height:120px">${esc(d.common.content)}</textarea>
        <label class="small">话题标签（空格分隔，不用写 #）</label>
        <input type="text" id="cTags" value="${esc(tagsToText(d.common.tags))}">
      </div>
      <div class="cards">${plats.map(cardHTML).join("") || `<div class="empty">这个浏览器还没选平台，点右上角“平台设置”</div>`}</div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="ghost" id="btnDelete">删除这条草稿</button>
      </div>`;
    renderBanner();
    renderImages();
    renderVideo();
    bindEditor();
    plats.forEach(updateCount);
  }

  function cardHTML(p) {
    const d = current();
    const part = d[p.key];
    const n = accName(p);
    const pub = d.published?.[p.key];
    const imgSwitch = p.kind === "dynamic" && !p.needImage
      ? `<label class="switch" title="是否把上面的配图一起发到这个平台"><input type="checkbox" data-img ${prefs.withImg[p.key] !== false ? "checked" : ""}>带图</label>` : "";
    const vidSwitch = p.allowVideo
      ? `<label class="switch" title="是否把上面的视频一起发到这个平台（带视频时不带图）"><input type="checkbox" data-vid ${prefs.withVideo[p.key] ? "checked" : ""}>带视频</label>` : "";
    return `<div class="card ${prefs.selected[p.key] ? "" : "off"}" data-p="${p.key}">
      <div class="card-h">
        <span class="badge" style="background:${p.color}"></span>
        <span class="name">${p.name}</span>
        <span class="kind">${p.kind === "video" ? "视频" : (p.needImage ? "图文" : "动态")}</span>
        <span class="acc">${n ? "@" + esc(n) : ""}</span>
        <div class="right">
          ${imgSwitch}${vidSwitch}
          <label class="switch" title="不勾选时插件只填好内容，由你在平台页面上自己点发布"><input type="checkbox" data-auto ${prefs.auto[p.key] ? "checked" : ""}>自动发布</label>
          <label class="switch"><input type="checkbox" data-sel ${prefs.selected[p.key] ? "checked" : ""}>发布</label>
        </div>
      </div>
      ${p.hasTitle ? `<label class="small">标题（≤${p.titleMax} 字${p.titleRequired ? "，必填" : ""}）</label>
        <input type="text" data-f="title" value="${esc(part.title)}">
        <div class="count" data-tc></div>` : ""}
      <label class="small">${p.kind === "video" ? "说明" : "正文"}</label>
      <textarea data-f="content">${esc(part.content)}</textarea>
      <label class="small">话题标签（空格分隔，不用写 #）${p.tagsInDesc ? "· 会放在说明末尾" : ""}</label>
      <input type="text" data-f="tags" value="${esc(tagsToText(part.tags))}">
      <div class="count" data-c></div>
      <div class="hint" data-hint></div>
      <div class="card-f">
        <button data-copy>复制全文</button>
        <button data-fromcommon class="ghost" title="用通用文案覆盖这个平台的文案">用通用文案</button>
        <span class="st ${pub ? "done" : ""}">${pub ? "已发送到插件 " + fmtTime(pub) : "未发布"}</span>
      </div>
    </div>`;
  }

  function mediaPlan(p, d) {
    // 返回该平台实际会带的图片/视频
    const video = currentVideo(d);
    if (p.kind === "video") return { images: [], video };
    const wantVideo = p.allowVideo && prefs.withVideo[p.key] && video;
    if (wantVideo) return { images: [], video };
    const useImg = p.needImage || prefs.withImg[p.key] !== false;
    return { images: useImg ? currentImages.slice(0, p.maxImages) : [], video: null };
  }

  function updateCount(p) {
    const d = current(); if (!d) return;
    const card = $(`.card[data-p="${p.key}"]`); if (!card) return;
    const n = countFor(p, d);
    const c = $("[data-c]", card);
    c.textContent = `${n} / ${p.max}${p.weighted ? "（中文按 2 计，含标签）" : "（含标签）"}`;
    c.classList.toggle("over", n > p.max);
    if (p.hasTitle) {
      const tn = [...(d[p.key].title || "")].length;
      const tc = $("[data-tc]", card);
      tc.textContent = `${tn} / ${p.titleMax}`;
      tc.classList.toggle("over", tn > p.titleMax);
    }
    const hint = [];
    const video = currentVideo(d);
    if (p.needImage && !currentImages.length) hint.push(`${p.name}图文笔记必须至少 1 张图`);
    if (p.needVideo && !video) hint.push(`${p.name} 需要视频`);
    if (p.allowVideo && prefs.withVideo[p.key]) {
      if (!video) hint.push("勾了带视频，但还没有视频");
      else if (currentImages.length && prefs.withImg[p.key] !== false) hint.push("带视频时不会带图");
    }
    const plan = mediaPlan(p, d);
    if (p.kind === "dynamic" && p.maxImages && currentImages.length > p.maxImages && plan.images.length) hint.push(`只会带前 ${p.maxImages} 张图`);
    $("[data-hint]", card).textContent = hint.join("；");
  }
  const updateAllCounts = () => enabledPlatforms().forEach(updateCount);

  function renderImages() {
    const el = $("#images"); if (!el) return;
    el.innerHTML = currentImages.map((im, i) => `<div class="thumb"><img src="${im.dataUrl}" alt=""><span class="idx">${i + 1}</span><button data-rm="${i}" title="移除">×</button></div>`).join("")
      + `<div class="add-img" id="addImg">＋ 添加图片<br>可拖拽</div>`;
    $("#addImg").onclick = () => $("#fileInput").click();
    el.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
      currentImages.splice(+b.dataset.rm, 1);
      await idb.set(currentId, currentImages); renderImages(); updateAllCounts();
    });
  }

  function renderVideo() {
    const body = $("#vBody"); if (!body) return;
    const d = current();
    if (d.videoSource === "url") {
      body.innerHTML = `<input type="url" id="vUrl" style="margin-top:8px" placeholder="https://…/video.mp4（插件能直接下载的地址，适合大于 ${VIDEO_MAX_MB}MB 的视频）" value="${esc(d.videoUrl)}">
        <div class="video-info" id="vInfo"></div>`;
      const info = () => {
        const u = d.videoUrl.trim();
        const el = $("#vInfo");
        if (!u) { el.className = "video-info"; el.textContent = "链接会随草稿保存。"; }
        else if (!/^https:\/\//i.test(u)) { el.className = "video-info err"; el.textContent = "必须是 https:// 开头的链接"; }
        else { el.className = "video-info ok"; el.textContent = "已填写视频链接（链接会随草稿保存）"; }
      };
      info();
      $("#vUrl").oninput = (e) => { d.videoUrl = e.target.value; touch(); info(); updateAllCounts(); };
    } else {
      const v = localVideos.get(d.id);
      body.innerHTML = `<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button class="small" id="vPick">${v ? "换一个视频" : "选择视频"}</button>
          ${v ? `<button class="small ghost" id="vClear">移除</button>` : ""}
        </div>
        <div class="video-info ${v ? "ok" : ""}">${v ? `${esc(v.name)}（${mb(v.size)}）· 不会存进草稿，刷新页面后要重新选` : "视频只在本次打开时有效，发布前临时选择即可"}</div>
        ${v ? `<video class="preview" src="${v.previewUrl}" controls muted></video>` : ""}`;
      $("#vPick").onclick = () => $("#videoInput").click();
      const c = $("#vClear"); if (c) c.onclick = () => { URL.revokeObjectURL(v.previewUrl); localVideos.delete(d.id); renderVideo(); updateAllCounts(); };
    }
    document.querySelectorAll("#vSrc input").forEach(r => r.onchange = () => {
      d.videoSource = r.value; touch();
      document.querySelectorAll("#vSrc label").forEach(l => l.classList.toggle("on", l.contains(r)));
      renderVideo(); updateAllCounts();
    });
  }

  async function setLocalVideo(file) {
    const d = current(); if (!d || !file) return;
    if (!file.type.startsWith("video/") && !/\.(mp4|mov|m4v|webm)$/i.test(file.name)) return toast("请选择视频文件");
    if (file.size > VIDEO_MAX_MB * 1024 * 1024) {
      alert(`这个视频有 ${mb(file.size)}，超过 ${VIDEO_MAX_MB}MB，插件消息传不过去。\n\n请压缩后再选，或者上传到网上后切换到“https 链接”。`);
      return;
    }
    log(`正在读取视频 ${file.name}…`);
    const old = localVideos.get(d.id); if (old) URL.revokeObjectURL(old.previewUrl);
    const dataUrl = await readAsDataURL(file);
    localVideos.set(d.id, { name: file.name, type: file.type || guessVideoType(file.name), size: file.size, dataUrl, previewUrl: URL.createObjectURL(file) });
    log(`视频已就绪：${file.name}（${mb(file.size)}）`);
    if (current()?.id === d.id) { renderVideo(); updateAllCounts(); }
  }

  async function addFiles(files) {
    const d = current(); if (!d) return;
    const vids = files.filter(f => f.type.startsWith("video/"));
    if (vids.length && usesVideo()) { if (d.videoSource === "url") { d.videoSource = "file"; touch(); renderEditor(); } await setLocalVideo(vids[0]); }
    const imgs = files.filter(f => f.type.startsWith("image/"));
    if (!imgs.length) return;
    for (const f of imgs) {
      if (f.size > 20 * 1024 * 1024) { toast(`${f.name} 超过 20MB，已跳过`); continue; }
      currentImages.push({ name: f.name, type: f.type, size: f.size, dataUrl: await readAsDataURL(f) });
    }
    await idb.set(d.id, currentImages);
    renderImages(); updateAllCounts();
  }

  function touch() { const d = current(); d.updatedAt = Date.now(); saveDrafts(); }

  function bindEditor() {
    const d = current();
    $("#fTopic").oninput = (e) => { d.topic = e.target.value || "未命名草稿"; touch(); renderList(); };
    $("#fTime").oninput = (e) => { d.suggestedTime = e.target.value; touch(); renderList(); };
    $("#btnDelete").onclick = async () => {
      if (!confirm(`删除“${d.topic}”？`)) return;
      drafts = drafts.filter(x => x.id !== d.id); await idb.del(d.id); localVideos.delete(d.id); saveDrafts();
      currentId = drafts[0]?.id || null; renderList(); renderEditor();
    };

    // 通用文案
    const onCommon = () => { touch(); if (prefs.linked) syncCommonToAll(d); };
    const ct = $("#cTitle"); if (ct) ct.oninput = (e) => { d.common.title = e.target.value; onCommon(); };
    $("#cContent").oninput = (e) => { d.common.content = e.target.value; onCommon(); };
    $("#cTags").oninput = (e) => { d.common.tags = normTags(e.target.value); onCommon(); };
    $("#fLinked").onchange = (e) => { prefs.linked = e.target.checked; savePrefs(); if (prefs.linked) syncCommonToAll(d); };
    $("#btnSyncAll").onclick = () => {
      const plats = enabledPlatforms();
      const changed = plats.filter(p => {
        const cur = d[p.key], want = commonFor(p, d.common);
        const hasText = cur.content.trim() || cur.title.trim() || cur.tags.length;
        return hasText && JSON.stringify(cur) !== JSON.stringify(want);
      });
      if (changed.length && !confirm(`会覆盖这些平台已有的文案：${changed.map(p => p.name).join("、")}\n\n确定同步？`)) return;
      syncCommonToAll(d);
      toast(`已同步到 ${plats.map(p => p.name).join("、")}`);
    };

    for (const p of enabledPlatforms()) {
      const card = $(`.card[data-p="${p.key}"]`);
      card.querySelectorAll("[data-f]").forEach(inp => inp.oninput = () => {
        const f = inp.dataset.f;
        d[p.key][f] = f === "tags" ? normTags(inp.value) : inp.value;
        touch(); updateCount(p);
      });
      $("[data-sel]", card).onchange = (e) => { prefs.selected[p.key] = e.target.checked; savePrefs(); card.classList.toggle("off", !e.target.checked); };
      $("[data-auto]", card).onchange = (e) => { prefs.auto[p.key] = e.target.checked; savePrefs(); };
      const imgSw = $("[data-img]", card);
      if (imgSw) imgSw.onchange = (e) => { prefs.withImg[p.key] = e.target.checked; savePrefs(); updateCount(p); };
      const vidSw = $("[data-vid]", card);
      if (vidSw) vidSw.onchange = (e) => { prefs.withVideo[p.key] = e.target.checked; savePrefs(); updateCount(p); };
      $("[data-copy]", card).onclick = async () => {
        const text = (p.hasTitle && d[p.key].title ? d[p.key].title + "\n\n" : "") + fullText(p, d);
        try { await navigator.clipboard.writeText(text); toast(`已复制 ${p.name} 全文`); } catch { toast("复制失败，请手动选择"); }
      };
      $("[data-fromcommon]", card).onclick = () => {
        d[p.key] = commonFor(p, d.common); touch();
        card.querySelectorAll("[data-f]").forEach(inp => { const f = inp.dataset.f; inp.value = f === "tags" ? tagsToText(d[p.key].tags) : (d[p.key][f] || ""); });
        updateCount(p);
      };
    }
  }

  /* ---------- 发布记录 ---------- */
  let history = lsGet(LS_HISTORY, []);
  function addHistory(item) { history.unshift(item); history = history.slice(0, 300); lsSet(LS_HISTORY, history); }
  function renderHistory() {
    $("#histList").innerHTML = history.length ? history.map(h => `<div class="hist-item">
        <div><b>${esc(h.topic)}</b></div>
        <div class="meta">${fmtTime(h.at)} · ${h.space ? "空间：" + esc(h.space) : ""}${h.video ? " · 视频：" + esc(h.video) : ""}</div>
        <div class="res">${h.results.map(r => `<span class="${r.ok ? "ok" : "bad"}">${esc(r.name)} ${r.ok ? "✓ 已发送" + (r.auto ? "（自动发布）" : "（只填好）") : "✗ " + esc(r.msg || "")}</span>`).join("")}</div>
      </div>`).join("") : `<div class="empty">还没有发布记录</div>`;
  }

  /* ---------- 发布 ---------- */
  let publishing = false;
  async function publish() {
    const d = current();
    if (!d) return toast("先选一条草稿");
    if (publishing) return;
    if (extState !== "ready") { await checkExtension(); if (extState !== "ready") return toast("插件未连接或未授权"); }
    const targets = enabledPlatforms().filter(p => prefs.selected[p.key]);
    if (!targets.length) return toast("至少勾选一个平台");

    const problems = [];
    const video = currentVideo(d);
    if (d.videoSource === "url" && d.videoUrl.trim() && !video) problems.push("视频链接必须以 https:// 开头");
    for (const p of targets) {
      const part = d[p.key];
      const plan = mediaPlan(p, d);
      if (!part.content.trim() && p.kind === "dynamic" && !plan.images.length && !plan.video) problems.push(`${p.name} 正文是空的`);
      if (countFor(p, d) > p.max) problems.push(`${p.name} 超出字数`);
      if (p.hasTitle && (p.titleRequired || p.needImage) && !part.title.trim()) problems.push(`${p.name} 缺标题`);
      if (p.hasTitle && [...part.title].length > p.titleMax) problems.push(`${p.name} 标题超过 ${p.titleMax} 字`);
      if (p.hasTitle && /[<>]/.test(part.title) && p.key === "youtube") problems.push("YouTube 标题里不能有 < 或 >");
      if (p.needImage && !currentImages.length) problems.push(`${p.name} 需要至少 1 张图`);
      if (p.needVideo && !video) problems.push(`${p.name} 需要视频`);
    }
    if (problems.length) return alert("发布前请先处理：\n\n· " + problems.join("\n· "));

    const space = settings.space || "";
    const autos = targets.filter(p => prefs.auto[p.key]).map(p => p.name);
    const msg = (space ? `【当前空间：${space}】\n\n` : "") + `将依次打开 ${targets.map(p => p.name).join("、")} 的发布页并填好内容。\n\n`
      + (autos.length ? `会自动点击发布：${autos.join("、")}\n` : "")
      + (targets.length > autos.length ? `只填好不发布（需要你自己点）：${targets.filter(p => !prefs.auto[p.key]).map(p => p.name).join("、")}\n` : "")
      + "\n确定继续？";
    if (!confirm(msg)) return;

    publishing = true; $("#btnPublish").disabled = true;
    const results = [];
    try {
      for (let i = 0; i < targets.length; i++) {
        const p = targets[i];
        const part = d[p.key];
        const plan = mediaPlan(p, d);
        const tags = normTags(part.tags);
        let data;
        if (p.kind === "video") {
          data = {
            title: p.hasTitle ? part.title.trim() : "",   // TikTok 会把 title 拼进说明，所以留空
            // YouTube 会把 tags 拼进标题，容易超过 100 字，所以标签改放在说明末尾
            content: p.tagsInDesc && tags.length ? `${part.content}\n\n${hashTags(tags)}` : part.content,
            video: plan.video,
            tags: p.tagsInDesc ? [] : tags,
          };
        } else {
          data = {
            title: p.hasTitle ? part.title : "",   // X、Threads 会把 title 拼进正文，所以留空
            content: part.content,
            images: plan.images.map((im, k) => ({ name: im.name || `image-${k + 1}.png`, url: im.dataUrl, type: im.type, size: im.size })),
            videos: plan.video ? [plan.video] : [],
            tags,
          };
        }
        const syncData = { platforms: [{ name: p.mp }], isAutoPublish: !!prefs.auto[p.key], data };
        log(`正在发送到 ${p.name}（${i + 1}/${targets.length}）…`);
        const r = await ext("PUBLISH", syncData, plan.video ? 60000 : 15000);
        if (r.code !== 0) {
          const m = r.code === -1 ? "插件无响应" : (r.message || r.code);
          results.push({ name: p.name, ok: false, msg: m });
          log(`${p.name} 发送失败：${m}`); toast(`${p.name} 发送失败`);
        } else {
          results.push({ name: p.name, ok: true, auto: !!prefs.auto[p.key] });
          d.published = d.published || {}; d.published[p.key] = Date.now(); touch();
          const st = $(`.card[data-p="${p.key}"] .st`);
          if (st) { st.textContent = "已发送到插件 " + fmtTime(d.published[p.key]); st.classList.add("done"); }
          renderList();
        }
        if (i < targets.length - 1) {
          for (let s = PUBLISH_GAP_MS / 1000; s > 0; s--) { log(`${p.name} 已处理，${s} 秒后发送下一个平台…`); await sleep(1000); }
        }
      }
      log("全部发送完成。请到各平台标签页确认结果" + (targets.some(p => !prefs.auto[p.key]) ? "，没勾自动发布的平台要你自己点发布" : ""));
    } finally {
      publishing = false; $("#btnPublish").disabled = false;
      if (results.length) {
        const v = currentVideo(d);
        addHistory({ at: Date.now(), space, draftId: d.id, topic: d.topic, results, video: v ? v.name : "" });
      }
    }
  }

  /* ---------- 平台设置 ---------- */
  let draftSettings = null;
  function openSettings() {
    draftSettings = JSON.parse(JSON.stringify(settings));
    $("#setSpace").value = draftSettings.space;
    renderSettings();
    $("#dlgSettings").showModal();
  }
  function renderSettings() {
    $("#setColors").innerHTML = COLORS.map(c => `<span data-c="${c}" class="${draftSettings.color === c ? "on" : ""}" style="background:${c}"></span>`).join("");
    $("#setColors").querySelectorAll("[data-c]").forEach(s => s.onclick = () => { draftSettings.color = s.dataset.c; renderSettings(); });
    $("#setPlatforms").innerHTML = PLATFORMS.map(p => `<label class="pf-opt ${draftSettings.enabled.includes(p.key) ? "on" : ""}">
        <input type="checkbox" data-k="${p.key}" ${draftSettings.enabled.includes(p.key) ? "checked" : ""}>${p.name}<span class="kind">${p.kind === "video" ? "视频" : "图文"}</span></label>`).join("");
    $("#setPlatforms").querySelectorAll("[data-k]").forEach(c => c.onchange = () => {
      const k = c.dataset.k;
      draftSettings.enabled = c.checked ? [...new Set([...draftSettings.enabled, k])] : draftSettings.enabled.filter(x => x !== k);
      renderSettings();
    });
  }
  $("#btnSettingsCancel").onclick = () => $("#dlgSettings").close();
  $("#btnSettingsOk").onclick = () => {
    draftSettings.space = $("#setSpace").value.trim();
    if (!draftSettings.enabled.length) return alert("至少选一个平台。");
    draftSettings.enabled = PLATFORMS.map(p => p.key).filter(k => draftSettings.enabled.includes(k));
    settings = draftSettings;
    lsSet(LS_SETTINGS, settings);
    $("#dlgSettings").close();
    applySpace(); renderAccounts(); renderList(); renderEditor();
    toast("设置已保存");
  };

  /* ---------- 全局绑定 ---------- */
  $("#btnNew").onclick = () => { const d = blankDraft(); drafts.unshift(d); saveDrafts(); currentId = d.id; renderList(); renderEditor(); };
  $("#draftList").onclick = (e) => { const it = e.target.closest(".draft-item"); if (!it) return; currentId = it.dataset.id; renderList(); renderEditor(); };
  $("#btnImport").onclick = () => { $("#importText").value = ""; $("#dlgImport").showModal(); };
  $("#btnImportCancel").onclick = () => $("#dlgImport").close();
  $("#btnImportOk").onclick = () => {
    try {
      const list = parseImport($("#importText").value);
      const { added, updated } = mergeDrafts(list);
      $("#dlgImport").close();
      currentId = drafts[0]?.id || currentId;
      renderList(); renderEditor();
      toast(`导入完成：新增 ${added} 条，更新 ${updated} 条`);
    } catch (e) { alert("格式不对，没能解析：\n" + e.message); }
  };
  $("#btnSync").onclick = async () => {
    try {
      const res = await fetch("drafts.json?_=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status === 404 ? "仓库里还没有 drafts.json" : "HTTP " + res.status);
      const list = parseImport(await res.text());
      const { added, updated } = mergeDrafts(list);
      if (!currentId) currentId = drafts[0]?.id;
      renderList(); renderEditor();
      toast(`同步完成：新增 ${added} 条，更新 ${updated} 条`);
    } catch (e) { toast("同步失败：" + e.message); }
  };
  $("#btnExport").onclick = () => {
    const blob = new Blob([JSON.stringify({ drafts }, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `drafts-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("#btnHistory").onclick = () => { renderHistory(); $("#dlgHistory").showModal(); };
  $("#btnHistClose").onclick = () => $("#dlgHistory").close();
  $("#btnHistClear").onclick = () => { if (!confirm("清空全部发布记录？")) return; history = []; lsSet(LS_HISTORY, history); renderHistory(); };
  $("#btnSettings").onclick = openSettings;
  $("#spaceBadge").onclick = openSettings;
  $("#btnTrust").onclick = async () => {
    log("已请求插件授权，请在弹出的插件窗口里确认…");
    const r = await ext("REQUEST_TRUST_DOMAIN", {}, 120000);
    if (r.code === 0 && r.data?.trusted) { toast("授权成功"); await checkExtension(); }
    else { log("授权未完成"); await checkExtension(); }
  };
  $("#btnRefreshAcc").onclick = async () => {
    if (extState !== "ready") return checkExtension();
    await ext("REFRESH_ACCOUNT_INFOS", { isFocused: true });
    toast("插件正在刷新账号，完成后会自动更新");
    for (let i = 0; i < 6; i++) { await sleep(5000); await loadAccounts(); }
  };
  $("#btnPublish").onclick = publish;
  $("#fileInput").onchange = (e) => { addFiles([...e.target.files]); e.target.value = ""; };
  $("#videoInput").onchange = (e) => { setLocalVideo(e.target.files[0]); e.target.value = ""; };
  document.addEventListener("dragover", (e) => { if (current()) e.preventDefault(); });
  document.addEventListener("drop", (e) => { if (!current()) return; e.preventDefault(); addFiles([...e.dataTransfer.files]); });
  document.addEventListener("paste", (e) => {
    if (!current() || e.target.closest("textarea, input")) return;
    const files = [...(e.clipboardData?.files || [])]; if (files.length) addFiles(files);
  });
  window.addEventListener("beforeunload", (e) => { if (publishing) { e.preventDefault(); e.returnValue = ""; } });

  applySpace();
  renderList();
  renderEditor();
  renderAccounts();
  checkExtension();
})();
</script>
</body>
</html>
